<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITRE_ACTIVITE}} — Simulateur Enseignant SCORM</title>
  
  <!-- Feuilles de style moteur-ui (Loi 25 - Zéro CDN) -->
  <link rel="stylesheet" href="{{MOTEUR_UI_PATH}}/src/style.css">
  <link rel="stylesheet" href="{{MOTEUR_UI_PATH}}/src/tokens.css">
  <link rel="stylesheet" href="{{MOTEUR_UI_PATH}}/simulateurs/scorm/scorm.css">
</head>
<body>

  <!-- Conteneur racine injecté par SCORMSimulator -->
  <div id="scormAppRoot"></div>

  <!-- Scripts d'assistance mathématique et moteur modulaire SCORM -->
  <script src="{{MOTEUR_UI_PATH}}/src/mathjax.js" defer></script>
  <script src="{{MOTEUR_UI_PATH}}/simulateurs/scorm/lame.min.js" defer></script>
  <script src="{{MOTEUR_UI_PATH}}/simulateurs/scorm/narration-recorder.js" defer></script>
  <script src="{{MOTEUR_UI_PATH}}/simulateurs/scorm/scorm-app.js" defer></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      SCORMSimulator.init({
        activityUrl: './index.html',
        container: '#scormAppRoot',
        title: '{{TITRE_ACTIVITE}}',
        zipFilename: '{{ZIP_FILENAME}}'
      });
    });
  </script>
</body>
</html>
