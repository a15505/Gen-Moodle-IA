<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t4">
  <title id="t4">Un kilogramme séparé en 4 portions de 0,25 kg ; une portion vaut 250 g</title>
  <style>
    .t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#0f172a}
    .l{font-size:18px;font-weight:700}
    .s{font-size:16px;fill:#334155;font-variant-numeric:tabular-nums}
    .p{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
    .q{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
    .on{fill:#fde68a;stroke:#92400e;stroke-width:2}
  </style>
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- 1 kg = 4 portions de 0,25 kg -->
  <rect x="60" y="50" width="150" height="150" class="on"/>
  <rect x="210" y="50" width="150" height="150" class="q"/>
  <rect x="60" y="200" width="150" height="150" class="q"/>
  <rect x="210" y="200" width="150" height="150" class="q"/>
  <rect x="60" y="50" width="300" height="300" fill="none" stroke="#334155" stroke-width="2.5"/>

  <text x="135" y="120" text-anchor="middle" class="t p">0,25 kg</text>
  <text x="135" y="144" text-anchor="middle" class="t s">250 g</text>
  <text x="285" y="120" text-anchor="middle" class="t p">0,25 kg</text>
  <text x="285" y="144" text-anchor="middle" class="t s">250 g</text>
  <text x="135" y="270" text-anchor="middle" class="t p">0,25 kg</text>
  <text x="135" y="294" text-anchor="middle" class="t s">250 g</text>
  <text x="285" y="270" text-anchor="middle" class="t p">0,25 kg</text>
  <text x="285" y="294" text-anchor="middle" class="t s">250 g</text>

  <text x="210" y="382" text-anchor="middle" class="t l">1 kg = 1 000 g</text>

  <!-- Explications -->
  <rect x="400" y="60" width="22" height="22" class="on"/>
  <text x="434" y="77" class="t s">1 portion sur 4 = un quart</text>
  <text x="400" y="122" class="t l">4 portions = 1 kg = 1 000 g</text>
  <text x="400" y="160" class="t l">1 portion = 0,25 kg = 250 g</text>
  <text x="400" y="186" class="t s">donc 250 g = 0,25 kg</text>

  <line x1="400" y1="220" x2="680" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="254" class="t l">g → kg : le nombre diminue</text>
  <text x="400" y="278" class="t s">petite unité vers grande unité</text>
  <text x="400" y="326" class="t l">kg → g : le nombre augmente</text>
  <text x="400" y="350" class="t s">grande unité vers petite unité</text>
</svg>
