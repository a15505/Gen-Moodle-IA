<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t2">
  <title id="t2">Une concentration de 20 g/L signifie 20 g de sel dans chaque litre</title>
  <style>
    .t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#0f172a}
    .l{font-size:18px;font-weight:700}
    .s{font-size:15px;fill:#334155}
    .f{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
    .eau{fill:#dbeafe;stroke:#334155;stroke-width:2.5}
    .sep{stroke:#334155;stroke-width:1.5;stroke-dasharray:6 5}
    .p{fill:#b45309}
  </style>
  <defs>
    <g id="litre10" class="p">
      <circle cx="20" cy="25" r="5"/><circle cx="60" cy="18" r="5"/><circle cx="100" cy="30" r="5"/>
      <circle cx="35" cy="55" r="5"/><circle cx="80" cy="50" r="5"/><circle cx="15" cy="85" r="5"/>
      <circle cx="55" cy="90" r="5"/><circle cx="98" cy="78" r="5"/><circle cx="30" cy="108" r="5"/>
      <circle cx="85" cy="105" r="5"/>
    </g>
    <g id="demi5" class="p">
      <circle cx="20" cy="18" r="5"/><circle cx="62" cy="32" r="5"/><circle cx="100" cy="15" r="5"/>
      <circle cx="38" cy="45" r="5"/><circle cx="92" cy="47" r="5"/>
    </g>
  </defs>
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- Légende -->
  <circle cx="276" cy="44" r="5" class="p"/>
  <text x="290" y="50" class="t s">= 2 g de sel dissous</text>

  <!-- 0,5 L -->
  <rect x="60" y="200" width="120" height="60" class="eau"/>
  <use href="#demi5" x="60" y="200"/>
  <!-- 1 L -->
  <rect x="260" y="140" width="120" height="120" class="eau"/>
  <use href="#litre10" x="260" y="140"/>
  <!-- 2 L -->
  <rect x="450" y="140" width="240" height="120" class="eau"/>
  <line x1="570" y1="142" x2="570" y2="258" class="sep"/>
  <use href="#litre10" x="450" y="140"/>
  <use href="#litre10" x="570" y="140"/>

  <text x="120" y="292" text-anchor="middle" class="t l">0,5 L</text>
  <text x="120" y="314" text-anchor="middle" class="t s">10 g de sel</text>
  <text x="320" y="292" text-anchor="middle" class="t l">1 L</text>
  <text x="320" y="314" text-anchor="middle" class="t s">20 g de sel</text>
  <text x="570" y="292" text-anchor="middle" class="t l">2 L</text>
  <text x="570" y="314" text-anchor="middle" class="t s">40 g de sel</text>

  <line x1="40" y1="340" x2="680" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="372" text-anchor="middle" class="t l">Même concentration partout : 20 g dans chaque litre</text>
  <text x="360" y="402" text-anchor="middle" class="t f">C = 20 g/L</text>
</svg>
