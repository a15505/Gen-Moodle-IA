<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t8">
  <title id="t8">Préparer 500 mL d'une solution à 30 g/L : peser 15 g, puis compléter avec de l'eau</title>
  <style>
    .t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#0f172a;font-variant-numeric:tabular-nums}
    .l{font-size:18px;font-weight:700}
    .s{font-size:16px;fill:#334155}
    .eau{fill:#dbeafe}
    .verre{fill:none;stroke:#334155;stroke-width:2.5;stroke-linejoin:round}
    .p{fill:#b45309}
    .sep{stroke:#334155;stroke-width:1.5;stroke-dasharray:6 5}
    .bal{fill:#e2e8f0;stroke:#334155;stroke-width:2}
  </style>
  <rect width="720" height="420" fill="#ffffff"/>

  <circle cx="60" cy="34" r="5" class="p"/>
  <text x="74" y="40" class="t s">= 3 g de sel</text>

  <!-- 1 L à 30 g/L, coupé en deux moitiés -->
  <rect x="61" y="80" width="158" height="240" class="eau"/>
  <line x1="61" y1="200" x2="219" y2="200" class="sep"/>
  <g class="p">
    <circle cx="86" cy="104" r="5"/><circle cx="140" cy="98" r="5"/><circle cx="194" cy="112" r="5"/>
    <circle cx="110" cy="150" r="5"/><circle cx="176" cy="164" r="5"/>
    <circle cx="90" cy="226" r="5"/><circle cx="150" cy="222" r="5"/><circle cx="200" cy="240" r="5"/>
    <circle cx="116" cy="284" r="5"/><circle cx="182" cy="294" r="5"/>
  </g>
  <path d="M60 60 L60 314 Q60 321 67 321 L213 321 Q220 321 220 314 L220 60" class="verre"/>
  <text x="232" y="144" class="t s">0,5 L : 15 g</text>
  <text x="232" y="264" class="t s">0,5 L : 15 g</text>
  <text x="140" y="352" text-anchor="middle" class="t l">1 L : 30 g</text>
  <text x="140" y="376" text-anchor="middle" class="t s">30 g/L</text>

  <line x1="352" y1="60" x2="352" y2="380" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Balance : 15 g de sel -->
  <g class="p">
    <circle cx="420" cy="196" r="5"/><circle cx="432" cy="196" r="5"/><circle cx="444" cy="196" r="5"/>
    <circle cx="426" cy="186" r="5"/><circle cx="438" cy="186" r="5"/>
  </g>
  <path d="M396 202 L468 202 L460 212 L404 212 Z" class="bal"/>
  <rect x="428" y="212" width="8" height="58" class="bal"/>
  <rect x="392" y="270" width="80" height="22" rx="3" class="bal"/>
  <text x="432" y="330" text-anchor="middle" class="t l">15 g</text>

  <!-- Flèche -->
  <path d="M490 236 L540 236" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M540 228 L552 236 L540 244 Z" fill="#334155"/>

  <!-- Bécher complété jusqu'au trait de 500 mL -->
  <rect x="571" y="150" width="108" height="141" class="eau"/>
  <line x1="571" y1="150" x2="679" y2="150" class="sep"/>
  <g class="p">
    <circle cx="592" cy="180" r="5"/><circle cx="640" cy="172" r="5"/><circle cx="662" cy="214" r="5"/>
    <circle cx="604" cy="246" r="5"/><circle cx="650" cy="270" r="5"/>
  </g>
  <path d="M570 110 L570 285 Q570 292 577 292 L673 292 Q680 292 680 285 L680 110" class="verre"/>
  <text x="625" y="136" text-anchor="middle" class="t s">500 mL</text>
  <text x="625" y="330" text-anchor="middle" class="t l">30 g/L</text>
</svg>
